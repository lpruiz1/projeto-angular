<div class="overlay">
  <div class="dialog">
    <p>{{ message() }}</p>
    <div class="dialog-actions">
      <button type="button" class="secondary" (click)="onCancel()">Cancelar</button>
      <button type="button" class="delete" (click)="onConfirm()">Confirmar</button>
    </div>
  </div>
</div>
