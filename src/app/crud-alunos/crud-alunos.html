  <div class="card">
    <h2>{{ idEdicao !== null ? 'Editar aluno' : 'Cadastrar aluno' }}</h2>

    <form [formGroup]="form" (ngSubmit)="salvar()">
      <div class="campo">
        <label>Nome</label>
        <input type="text" formControlName="nome">
      </div>

      <div class="campo">
        <label>Idade</label>
        <input type="number" formControlName="idade">
      </div>

      <div class="acoes">
        <button type="submit" [disabled]="form.invalid">
          {{ idEdicao !== null ? 'Salvar edição' : 'Cadastrar' }}
        </button>

        @if (idEdicao !== null) {
          <button type="button" class="secundario" (click)="cancelarEdicao()">
            Cancelar
          </button>
        }
      </div>
    </form>
  </div>

  <div class="card">
    <h2>Alunos cadastrados</h2>

    @if (alunos.length === 0) {
      <p class="vazio">Nenhum aluno cadastrado ainda.</p>
    } @else {
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          @for (aluno of alunos; track aluno.id) {
            <tr>
              <td>{{aluno.nome}}</td>
              <td>{{aluno.idade}}</td>
              <td>
                <button (click)="editar(aluno)">Editar</button>
                <button class="excluir" (click)="remover(aluno.id)">Excluir</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    }
  </div>
