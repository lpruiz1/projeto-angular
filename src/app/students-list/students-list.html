<app-card title="Alunos cadastrados">

  <button cardActions (click)="goToNewStudent()">+ Novo aluno</button>

  @if (students().length === 0) {
    <p class="empty">Nenhum aluno cadastrado ainda.</p>
  } @else {
    <table>
      <thead>
        <tr>
          <th>Matrícula</th>
          <th>Nome</th>
          <th>Idade</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        @for (student of students(); track student.id) {
          <tr>
            <td>{{ student.registrationId }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.age }}</td>
            <td>
              <button (click)="edit(student.id)">Editar</button>
              <button class="delete" (click)="askToRemove(student.id)">Excluir</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }

</app-card>

@if (studentIdPendingDeletion() !== null) {
  <app-confirm-dialog
    message="Tem certeza que deseja excluir esse aluno?"
    (confirmed)="confirmRemoval()"
    (cancelled)="cancelRemoval()">
  </app-confirm-dialog>
}
